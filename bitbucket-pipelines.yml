image: node:20

pipelines:
  pull-requests:
    development:
      - step:
          name: Build checking (PR)
          caches:
            - node
          script:
            - npm install -g pnpm
            - pnpm install
            - pnpm run prettier
            - pnpm build

  branches:
    development:
      - step:
          name: Merge in dev
          caches:
            - node
          script:
            - echo "🧪 Runs only on merge into development"
