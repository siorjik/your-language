image: node:20

pipelines:
  pull-requests:
    'feature/*':
      - step:
          name: Build checking (PR) from feature
          caches:
            - node
          script:
            - npm install -g pnpm
            - pnpm install
            - pnpm run prettier
            - pnpm build

    'fix/*':
      - step:
          name: Build checking (PR) from fix
          caches:
            - node
          script:
            - npm install -g pnpm
            - pnpm install
            - pnpm run prettier
            - pnpm build

  branches:
    development:
      - step:
          name: Merge in development
          caches:
            - node
          script:
            - echo "🧪 Runs only on merge into development"

    main:
      - step:
          name: Merge in main
          caches:
            - node
          script:
            - echo "🧪 Runs only on merge into main"
