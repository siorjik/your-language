image: node:20

steps:
  - step: &build
      name: Build checking
      caches:
        - node
      script:
        - npm install -g pnpm
        - pnpm install
        - pnpm prettier
        - pnpm build

pipelines:
  pull-request:
    'development':
      - step: *build

  branches:
    development:
      - step:
      - name: Merge in development
        script:
          - echo "🧪 Runs only merge on development branch"
