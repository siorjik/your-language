image: node:20

steps:
  - step: &build
    name: Build checking
    caches:
      - node
    script:
      - npm install -g pnpm
      - pnpm install
      - pnpm prettier
      - pnpm build

  - step: &dev-merge
    name: Merge in dev
    caches:
      - node
    script:
         - echo "🧪 Runs only merge on development branch"

pipelines:
  pull-request:
    development:
      - step: *build

  branches:
    development:
      - step: *dev-merge
