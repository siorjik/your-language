image: creatiwww/docker-compose:latest

services:
  - docker:dind

stages:    
  - check_project_build
  - check_docker_build

cache:
  paths:
    - node_modules/

check_project_build_job:
  stage: check_project_build
  image: node:20-alpine
  tags:
    - build
  rules:
    - if: $CI_COMMIT_BRANCH == "development"
  script:
    - npm install pnpm -g
    - pnpm install
    - pnpm prettier
    - pnpm build
